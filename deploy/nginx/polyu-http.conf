# PolyU-agent 生产网关 · HTTP server（随前端镜像烧入，2026-09-09；域名解析生效后收敛为 ACME + 301）
#
# 角色与边界：
#   - 80 端口只保留两件事：Let's Encrypt ACME webroot 续期 + 全量 301 → https（443 = polyu-tls.conf）。
#   - map/resolver 声明在本文件顶层（http 上下文），conf.d 内全部 server 共用；
#     polyu-tls.conf 不重复声明 map（同变量二次 map 会让 nginx -t 直接失败），resolver 由 http 层继承。
#   - real_ip：网关侧以 $remote_addr 覆写 X-Real-IP；应用侧「guest 配额 IP 只信本网关」的整改归认证安全实施票。
#   - AI 生成内容标识位（合规要求预留）：响应头 X-AI-Generated，页面文案标识随移动端整改落地。

# SSE/WS 共用的升级头映射：无升级头时置空，保住 upstream keepalive（SSE 不需要 Upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 上游走运行时解析（Docker 内嵌 DNS）：变量 upstream 使 proxy_pass 不在启动时固化 IP，
# 容器滚动重建（up -d 换 IP）后无需重启网关，10s TTL 内自愈
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # 域名 + _ 兜底（IP 直访/SSH 隧道运维）：统一 301 到 https；
    # 隧道期注意 Host 为 localhost 时会跳 https://localhost（运维入口改走 443 隧道即可）
    server_name polyuguide.com www.polyuguide.com _;

    # Let's Encrypt webroot 续期（certbot 容器写 /var/www/certbot，compose 卷挂载）：
    # 前缀匹配优先于 location /，ACME 验证不被 301 截走
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
