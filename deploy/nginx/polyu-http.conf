# PolyU-agent 生产网关 · HTTP server（随前端镜像首发，2026-09-09）
#
# 角色与边界：
#   - 唯一公网入口（宿主机 80/443 在控制台防火墙放行；非公开验收期保持关闭走 SSH 隧道）。
#   - 上游 = compose 内部网络：polyu-app:9090（Spring context path=/api/ragent）、polyu-minio:9000（资产桶公共读）。
#   - real_ip：网关侧以 $remote_addr 覆写 X-Real-IP；应用侧「guest 配额 IP 只信本网关」的整改归认证安全实施票。
#   - AI 生成内容标识位（合规要求预留）：响应头 X-AI-Generated，页面文案标识随移动端整改落地。
#
# TLS：polyu-tls.conf.disabled（不入镜像），启用步骤见 deploy/README.md。

# SSE/WS 共用的升级头映射：无升级头时置空，保住 upstream keepalive（SSE 不需要 Upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 上游走运行时解析（Docker 内嵌 DNS）：变量 upstream 使 proxy_pass 不在启动时固化 IP，
# 容器滚动重建（up -d 换 IP）后无需重启网关，10s TTL 内自愈
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # 启用 TLS 前用 _ 兜住 IP 直访（隧道验服）；域名解析生效后改/追加 polyuguide.com www.polyuguide.com
    server_name _;

    # Let's Encrypt webroot 续期（certbot 容器写 /var/www/certbot，compose 卷挂载）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 后端 API（含 SSE 流式）。context path /api/ragent 由后端持有，网关只按 /api/ 前缀转发
    location /api/ {
        set $app_upstream polyu-app:9090;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 流式不缓冲：ragent sse-timeout-ms=900000（15min），读超时留余量
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 960s;
        proxy_send_timeout 300s;
        # multipart 上限对齐后端（50MB 文件 / 100MB 请求）
        client_max_body_size 100m;
        add_header X-AI-Generated "true" always;
    }

    # 多模态资产桶（ragent-assets 公共读）浏览器直连路径：
    # rag.storage.s3.public-url = <scheme>://<host>/minio → URL 形如 /minio/ragent-assets/xxx.png
    location /minio/ {
        set $minio_upstream polyu-minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端 SPA 静态资源（Vite build 产物，已随镜像烧入 /usr/share/nginx/html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
