# PolyU-agent 生产网关 · HTTP server（随前端镜像烧入，2026-09-09；域名解析生效后收敛为 ACME + 301）
#
# 角色与边界：
#   - 80 端口只保留两件事：Let's Encrypt ACME webroot 续期 + 全量 301 → https（443 = polyu-tls.conf）。
#   - map/resolver 声明在本文件顶层（http 上下文），conf.d 内全部 server 共用；
#     polyu-tls.conf 不重复声明 map（同变量二次 map 会让 nginx -t 直接失败），resolver 由 http 层继承。
#   - real_ip：网关侧以 $remote_addr 覆写 X-Real-IP；应用侧「guest 配额 IP 只信本网关」的整改归认证安全实施票。
#   - AI 生成内容标识位（合规要求预留）：响应头 X-AI-Generated，页面文案标识随移动端整改落地。

# SSE/WS 共用的升级头映射：无升级头时置空，保住 upstream keepalive（SSE 不需要 Upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# edge 加固（2026-09-12）：GET 状态变更端点 × 跨站发起 → 403。
# Sec-Fetch-Site 为浏览器强制头不可伪造；无此头的非现代客户端（空值）不命中=放行，
# 由登录态与应用层 Origin/Referer 守卫兜底。map 在 conf.d 顶层（http 上下文）声明，
# polyu-tls.conf 的 location 内只留单个 if（nginx if 不可嵌套、条件不支持变量插值）
map "$request_uri:$http_sec_fetch_site" $chat_crosssite_block {
    ~^/api/ragent/(rag/v3/chat|agent/v1/chat)[^:]*:cross-site$  1;
    default                                                     0;
}

# LLM 成本面限流：只计两条 chat 端点。
# 空键不计是 nginx 文档行为（Requests with an empty key value are not accounted）——
# 非 chat 的 /api/ 请求键为空串不进桶，实现「location 不拆分、仅 chat 计数」；
# 10m 约十六万条 IPv4 会话状态，内存可忽略。速率 10r/m 起步，按实测调整。
map $request_uri $chat_limit_key {
    ~^/api/ragent/(rag/v3/chat|agent/v1/chat)  $binary_remote_addr;
    default                                     "";
}
limit_req_zone $chat_limit_key zone=api_chat:10m rate=10r/m;

# 上游走运行时解析（Docker 内嵌 DNS）：变量 upstream 使 proxy_pass 不在启动时固化 IP，
# 容器滚动重建（up -d 换 IP）后无需重启网关，10s TTL 内自愈
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # 域名 + _ 兜底（IP 直访/SSH 隧道运维）：统一 301 到 https；
    # 隧道期注意 Host 为 localhost 时会跳 https://localhost（运维入口改走 443 隧道即可）
    server_name polyuguide.com www.polyuguide.com _;

    # Let's Encrypt webroot 续期（certbot 容器写 /var/www/certbot，compose 卷挂载）：
    # 前缀匹配优先于 location /，ACME 验证不被 301 截走
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
