# PolyU-agent 生产网关 · TLS server 块（443；域名解析 + certbot 首签完成后启用，2026-09-09）
#
# 依赖（均在 polyu-http.conf 顶层声明，本文件不重复）：
#   - map $http_upgrade $connection_upgrade：同变量二次 map 会令 nginx -t 失败，故只声明一次；
#   - resolver 127.0.0.11：http 上下文声明被 server 继承，供本块的变量 upstream 运行时解析。
# 证书路径按 certbot 默认布局挂载：/opt/polyu/certs:/etc/letsencrypt:ro（compose 预置卷）。
# 启用步骤与实录：deploy/README.md「TLS 启用」。
# 2026-09-12 edge 加固批：
#   - /minio/：非 GET 一律拒（limit_except）+ 显式 client_max_body_size 1m + nosniff
#   - /api/：nosniff + HSTS 短 max-age 灰度 + CORS 响应头收敛（同源部署无需外泄）
#   - 两个 GET 状态变更端点拒 Sec-Fetch-Site: cross-site（长期根治改 POST 归上游）
#   - X-Forwarded-For 改覆写 $remote_addr（应用侧取 XFF 首值，覆写可防客户端伪造链）
#   - www 独立 server 301 → apex（证书双域覆盖，certonly -d polyuguide.com -d www）
# 2026-09-19 O3/L6：/minio/ 反代收敛到 /minio/ragent-assets/ 资产桶前缀，其余 /minio/** 404。
# 线上生效=push 后 deploy 滚动（compose 挂载 conf.d 随镜像/卷更新后 reload）。

server {
    listen 443 ssl;
    http2 on;
    server_name polyuguide.com;

    ssl_certificate     /etc/letsencrypt/live/polyuguide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyuguide.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS 灰度：上线稳定后先下发短 max-age 留退路，观察期后升 31536000。
    # 注意 nginx add_header 继承规则：任一 location 自带 add_header 即不再继承 server 层，
    # 故本头与 nosniff 一并在每个 location 显式声明。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 后端 API（含 SSE 流式）。context path /api/ragent 由后端持有，网关只按 /api/ 前缀转发
    location /api/ {
        set $app_upstream polyu-app:9090;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而非追加（$proxy_add_x_forwarded_for 会把客户端伪造的 XFF 链带上，
        # 应用侧取 XFF 首值即中招）。覆写后 XFF 恒为网关所见的真实来源。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 流式不缓冲：ragent sse-timeout-ms=900000（15min），读超时留余量
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 960s;
        proxy_send_timeout 300s;
        # multipart 上限对齐后端（50MB 文件 / 100MB 请求）
        client_max_body_size 100m;

        # 同源部署无需 CORS 响应头，上游应用层即便返回也一律不下发，
        # 防 allowedOrigin 配置回退时 credentials 面重新暴露
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;

        # GET 状态变更端点拒跨站发起（判定 map=chat_crosssite_block，声明在
        # polyu-http.conf 顶层；location 内只留单个 if，规避 if 嵌套/插值限制）
        if ($chat_crosssite_block = 1) {
            return 403;
        }

        # LLM 成本面限流：zone=api_chat 声明在 polyu-http.conf 顶层，
        # map 空键=非 chat 请求不计数。SSE 不受影响——一次提问=一个被放行的长请求，
        # limit_req 只在请求准入时计一次，流式响应期不再计数；burst=20 nodelay 吸收
        # 前端重试+连发多轮的瞬时限。429 而非默认 503（客户端可分辨限流与故障）。
        # 速率 10r/m=起步值，按实测调整。
        limit_req zone=api_chat burst=20 nodelay;
        limit_req_status 429;

        add_header X-AI-Generated "true" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # 多模态资产桶（ragent-assets 公共读）浏览器直连路径（O3/L6 前缀收敛）：
    # rag.storage.s3.public-url = https://polyuguide.com/minio/ragent-assets（完整前缀，含桶名）
    #  → URL 形如 /minio/ragent-assets/xxx.png，与收敛前同形（存量引用零迁移）。
    # 「哪些桶可经网关公网读」由此 location 单处决定，未来新桶误配匿名策略不再自动变公网可读。
    # 桶面只读（非 GET 一律 403）+ 请求体上限收紧 + nosniff。
    location /minio/ragent-assets/ {
        set $minio_upstream polyu-minio:9000;
        rewrite ^/minio/ragent-assets/(.*)$ /ragent-assets/$1 break;
        proxy_pass http://$minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 同口径：桶面为同源直连路径，CORS 响应头一律不下发
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        limit_except GET {
            deny all;
        }
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # 其余 /minio/** 不再反代（O3/L6）：裸 MinIO API 匿名通路（含其他桶、预签名 URL 出口）显式关闭
    location /minio/ {
        return 404;
    }

    # 前端 SPA 静态资源（Vite build 产物，已随镜像烧入 /usr/share/nginx/html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# www → apex 301：certbot 首签即双域（-d polyuguide.com -d www.polyuguide.com），
# 复用同一证书布局；独立 server 免去主块内 if 判 Host
server {
    listen 443 ssl;
    http2 on;
    server_name www.polyuguide.com;

    ssl_certificate     /etc/letsencrypt/live/polyuguide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyuguide.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://polyuguide.com$request_uri;
}
