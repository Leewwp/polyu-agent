# PolyU-agent 生产网关 · TLS server 块（443；域名解析 + certbot 首签完成后启用，2026-09-09）
#
# 依赖（均在 polyu-http.conf 顶层声明，本文件不重复）：
#   - map $http_upgrade $connection_upgrade：同变量二次 map 会令 nginx -t 失败，故只声明一次；
#   - resolver 127.0.0.11：http 上下文声明被 server 继承，供本块的变量 upstream 运行时解析。
# 证书路径按 certbot 默认布局挂载：/opt/polyu/certs:/etc/letsencrypt:ro（compose 预置卷）。
# 启用步骤与实录：deploy/README.md「TLS 启用」。
# 后续口径（归认证安全实施票，不在本包）：__Host- cookie、HSTS、应用侧 real IP 只信本网关、CORS 锁单 origin。

server {
    listen 443 ssl;
    http2 on;
    server_name polyuguide.com www.polyuguide.com;

    ssl_certificate     /etc/letsencrypt/live/polyuguide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyuguide.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 启用 HSTS（一经下发无法撤回，确认全站 HTTPS 稳定后再开）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 后端 API（含 SSE 流式）。context path /api/ragent 由后端持有，网关只按 /api/ 前缀转发
    location /api/ {
        set $app_upstream polyu-app:9090;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 流式不缓冲：ragent sse-timeout-ms=900000（15min），读超时留余量
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 960s;
        proxy_send_timeout 300s;
        # multipart 上限对齐后端（50MB 文件 / 100MB 请求）
        client_max_body_size 100m;
        add_header X-AI-Generated "true" always;
    }

    # 多模态资产桶（ragent-assets 公共读）浏览器直连路径：
    # rag.storage.s3.public-url = https://polyuguide.com/minio → URL 形如 /minio/ragent-assets/xxx.png
    location /minio/ {
        set $minio_upstream polyu-minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端 SPA 静态资源（Vite build 产物，已随镜像烧入 /usr/share/nginx/html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
