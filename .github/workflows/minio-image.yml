# MinIO 官方末社区版镜像 · 一次性构建（B3 升级窗，2026-11-12）
#
# 背景：minio/minio 自 Docker Hub 整仓删除（2026-09-11，D18 判例）、quay.io 匿名拉取 401
# （需 Red Hat 账号），官方镜像供应链断供——按 es-ik 先例自建推 GHCR：
# 二进制取自 dl.min.io 官方发布（构建期 sidecar SHA256 校验，见
# resources/docker/polyu-minio-2025-10-15.Dockerfile 头注）。
#
# 不并入 deploy 构建矩阵（D18 判例：deploy 不拉/不建基础设施镜像）：本镜像一次性发布，
# tag 固定为 MinIO release 名（非 commit sha）；服务器经 image-relay 工作流预置后由
# polyu-prod.env 的 IMAGE_MINIO 引用。
name: minio-image

on:
  workflow_dispatch:

concurrency:
  group: minio-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # 固定与 Dockerfile ARG 一致（构建参数透传防漂移；tag 与镜像名双写防错配）
      MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    steps:
      # action 全部按 commit-SHA 钉版（与 deploy.yml 同款，防 tag 漂移投毒）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"   # ghcr 仓库名强制小写（deploy.yml meta 同款判例）
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: resources/docker
          file: resources/docker/polyu-minio-2025-10-15.Dockerfile
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/polyu-agent-minio:${{ env.MINIO_RELEASE }}
            ghcr.io/${{ env.OWNER }}/polyu-agent-minio:latest
      - name: Record binary digest
        run: docker buildx imagetools inspect "ghcr.io/${OWNER}/polyu-agent-minio:${MINIO_RELEASE}" --format '{{json .Manifest.Digest}}'
