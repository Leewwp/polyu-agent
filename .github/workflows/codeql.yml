# CodeQL 静态安全分析：Java 面，PR + 每周例跑 + 手动触发。
# build-mode: none 免全量构建（纯抽取），Maven 项目推荐档；结果落 GitHub Security → Code scanning。
# action 按 commit-SHA 钉版（防 tag 漂移投毒）。
name: codeql

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 20 * * 1' # 每周一 UTC 20:17（北京周二 04:17，错峰不撞采集/观察任务）
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init-action@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze-action@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:java-kotlin"
