# CodeQL 静态安全分析：Java 面，PR + 每周例跑 + 手动触发。
# build-mode: none 免全量构建（纯抽取），Maven 项目推荐档；结果落 GitHub Security → Code scanning。
# action 按 commit-SHA 钉版（防 tag 漂移投毒）。
name: codeql

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 20 * * 1' # 每周一 UTC 20:17（北京周二 04:17，错峰不撞采集/观察任务）
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    # 2026-09-17（T24 续）：分析本体已跑通，但 SARIF 上传要求 code scanning 特性——
    # 个人账户私有仓无法启用 GHAS，仅公开仓免费可用。故私有期跳过（neutral），
    # 转公开后本门自动开始工作；勿删 workflow（否则公开后无人记得恢复）。
    if: ${{ github.event.repository.private == false }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-09-17 修（T24 扩面）：原子路径误写 init-action/analyze-action（该仓库实为
      # init/analyze 子目录），且原 SHA 并非注释所标 v4.38.0 的 commit——本文件从未跑成过
      # 一次（历次 PR 全 7–11s 秒挂 Can't find action.yml）。现钉真 v4.38.0 tag commit。
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          category: "/language:java-kotlin"
