# 依赖更新与漏洞面巡检。
# 只开版本更新 PR，不自动合并；安全告警依赖 GitHub Dependabot alerts（仓库设置开启）。
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 不升 major：milvus-sdk 3.x 需服务端 3.x 配套（本栈 2.6）；spotless 3.x 变更格式化规则面无升级驱动。
    # （MCP SDK major 上界 ignore 已随 #474 适配完成移除——现行 mcp-core+mcp-json-jackson2@2.1.0
    #   组合；后续 major 再评估。）
    ignore:
      - dependency-name: io.milvus:milvus-sdk-java
        versions: [">=3"]
      - dependency-name: com.diffplug.spotless:spotless-maven-plugin
        versions: [">=3"]
      # 不升 major：networknt 3.x 移除 Schema.validate(JsonNode)，mcp-sdk 2.x 的 jackson2
      # 适配层编译目标仍是 2.x（#510 CI 实证 NoSuchMethodError）；等 mcp-sdk 升编译目标后再动。
      - dependency-name: com.networknt:json-schema-validator
        versions: [">=3"]
      # 不跟 wrapper 更新：dependabot 的 wrapper 更新把 mvnw.cmd 以 CRLF 内容入库，合并后工作区常驻幻影改动
      # （#304 之后出现、#461 规范化修复、#553 复现）；需要升 Maven 时手改 distributionUrl。
      - dependency-name: org.apache.maven:apache-maven
      # 不升 major：tika-parsers-standard-package 在 4.x 的 BOM 里不再受管，pom 不可读（#559 CI 实证）；无升级驱动。
      - dependency-name: org.apache.tika:tika-bom
        versions: [">=4"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 不升 major：date-fns v4 变更 API 形态；docx-preview 0.4 无新能力驱动。
    ignore:
      - dependency-name: date-fns
        versions: [">=4"]
      - dependency-name: docx-preview
        versions: [">=0.4"]
      # 不升 major：react/react-dom 19 无功能升级驱动（#498 bump 残缺 ERESOLVE 证实迁移面
      # 含 @types 对组+peer 全套）；观察窗期不引入前端运行时面变更，后续有驱动再评估。
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: react-dom
        versions: [">=19"]
      # 不升 major：eslint-plugin-react-refresh 0.5 线 peer 要求 eslint 9（本仓 eslint 8.57+
      # typescript-eslint 7 线；#113 rebase 后 ERESOLVE 实证）。随 eslint 9 迁移一并评估。
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5"]
      # 不升 major：react-markdown 10 的 Options 类型变更致 MarkdownRenderer TS2322（#513
      # CI 实证），需专门适配；无升级驱动，有驱动时立适配票再升。
      - dependency-name: react-markdown
        versions: [">=10"]
      # 不升 major：TS 7 移除 baseUrl 并禁止非相对路径，本仓用 @/ 别名（#558 CI 实证）；需要专门迁移，有驱动再评估。
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 不升 major：buildx-action 4.x / login-action 4.x 无升级驱动。
    ignore:
      - dependency-name: docker/setup-buildx-action
        versions: [">=4"]
      - dependency-name: docker/login-action
        versions: [">=4"]
  # Dockerfile 基础镜像更新。Dockerfile 共 6 个：deploy/ ×3（backend/frontend-nginx/mcp）、
  # resources/docker/ ×2（es-stack/minio 源码构建）、resources/docker/graphrag/ ×1（neo4j-gds）
  # ——docker 生态不递归扫描，须按目录分别配置；根目录无 Dockerfile，directory: /
  # 会导致每次 Updates 必红（11-17 起反复失败根因）。
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /resources/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /resources/docker/graphrag
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
